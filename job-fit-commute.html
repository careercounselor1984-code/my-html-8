<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>통근시간 확인</title>
<style>
:root{--blue:#2457d6;--navy:#172b4d;--bg:#f5f7fb;--line:#e2e7ef;--muted:#667085;--green:#067647;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#172033;line-height:1.55}.top{background:linear-gradient(135deg,#142e54,#2457d6);color:#fff;padding:25px 18px}.topin,.wrap{max-width:820px;margin:auto}.eyebrow{font-size:11px;font-weight:850;color:#cfe0ff}.top h1{font-size:24px;margin:4px 0 5px}.top p{margin:0;color:#e4ecff;font-size:13px}.wrap{padding:18px 14px 42px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:11px;box-shadow:0 5px 18px rgba(28,46,76,.04)}h2{font-size:16px;color:var(--navy);margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:850;color:#475467;margin-bottom:5px}.field input{width:100%;padding:11px 12px;border:1px solid #cfd7e3;border-radius:9px;font-size:14px}.btn{border:1px solid #cbd5e1;background:#fff;color:#344054;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:850;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.hint{font-size:11px;color:var(--muted);margin-top:7px}.check{font-size:11px;color:#475467;margin-top:8px}.check input{vertical-align:-2px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.route{border:1px solid #e5eaf1;border-radius:12px;padding:14px}.route strong{font-size:14px}.big{font-size:26px;font-weight:950;color:var(--navy);margin:5px 0}.meta{font-size:11px;color:var(--muted);line-height:1.7}.notice{font-size:11.5px;color:#755b15;background:#fff8df;border:1px solid #f3d987;border-radius:10px;padding:10px 11px;margin-top:10px}.ok{font-size:12px;color:var(--green);background:#ecfdf3;border:1px solid #abefc6;border-radius:10px;padding:10px 11px}.error{font-size:12px;color:#96271f;background:#fff0ee;border:1px solid #f1b8b2;border-radius:10px;padding:11px}.resolved{font-size:11px;color:#475467;background:#f8fafc;border:1px dashed #cfd7e3;border-radius:10px;padding:10px;margin-bottom:10px}.tools{display:flex;justify-content:flex-end;margin-bottom:10px}.loading{padding:20px;text-align:center;color:var(--blue);font-weight:850}@media(max-width:640px){.grid,.summary{grid-template-columns:1fr}.top h1{font-size:21px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="eyebrow">채용 지원가능성 분석센터 · Kakao 통근 참고</div><h1>통근시간 확인</h1><p id="sub"></p></div></header>
<main class="wrap">
<div class="tools"><button class="btn" onclick="window.close()">창 닫기</button></div>
<section class="card"><h2>출발지 · 근무지</h2><div class="grid"><div class="field"><label>출발지 주소</label><input id="origin" placeholder="예: 울산 북구 송정동 ○○아파트"></div><div class="field"><label>근무지 주소</label><input id="destination" placeholder="회사/기관 주소 또는 근무지역"></div></div><label class="check"><input id="remember" type="checkbox" checked> 출발지를 이 브라우저에 기억</label><div class="hint">정확한 통근시간을 보려면 시·군만 입력하지 말고 도로명주소나 동·아파트명까지 입력하는 게 좋아요. 주소는 서버에 저장하지 않습니다.</div><div class="actions"><button id="run" class="btn primary">자동차·대중교통 조회</button></div></section>
<div id="result"></div>
</main>
<script>
const COMMUTE_API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/job-commute-batch';
const ANALYSIS_API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/job-analysis-bundle';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const company=q.get('company')||'',title=q.get('title')||'',source=q.get('source')||'',jobKey=q.get('jobKey')||'',companyClass=q.get('companyClass')||'';
$('sub').textContent=[company,title].filter(Boolean).join(' · ');
function savedOrigin(){try{const x=localStorage.getItem('jobfit_commute_origin_v1');if(x)return x;const p=JSON.parse(localStorage.getItem('jobfit_profile_v2')||'{}');return String(p.residence||'')}catch{return''}}
$('origin').value=savedOrigin();$('destination').value=q.get('destination')||q.get('region')||'';
function isCorporate(){return ['CORPORATE','WORK24_OPEN'].includes(source)||/대기업|중견기업|외국계/.test(companyClass)}
async function enrichCorporateAddress(){if(!isCorporate()||!company)return;const cur=$('destination').value.trim();const broad=!cur||/^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)(\s|$)/.test(cur)&&cur.length<15;if(!broad)return;try{const r=await fetch(ANALYSIS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'company',source,jobKey,company,title,region:q.get('region')||'',companyClass,url:q.get('url')||''})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)return;const a=d.analysis||{},dart=a.dart||{},nps=a.company?.nps||{},n=nps.selected||nps.companyWideCandidate;const addr=dart.available&&dart.address?dart.address:(n?.roadAddress||n?.lotAddress||'');if(addr)$('destination').value=addr}catch{}}
enrichCorporateAddress();
function routeHtml(label,x){if(!x?.ok)return `<div class="route"><strong>${esc(label)}</strong><div class="meta" style="margin-top:8px">경로를 확인하지 못했습니다.${x?.error?' · '+esc(x.error):''}</div></div>`;const fare=x.fare?` · 요금 약 ${Number(x.fare).toLocaleString('ko-KR')}원`:'';const tr=Number.isFinite(x.transfers)?` · 환승 ${x.transfers}회`:'';return `<div class="route"><strong>${esc(label)}</strong><div class="big">약 ${esc(x.durationMinutes)}분</div><div class="meta">거리 약 ${esc(x.distanceKm)}km${tr}${fare}</div></div>`}
$('run').onclick=async()=>{const origin=$('origin').value.trim(),destination=$('destination').value.trim();if(!origin||!destination){$('result').innerHTML='<div class="error">출발지와 근무지를 모두 입력해 주세요.</div>';return}if($('remember').checked)localStorage.setItem('jobfit_commute_origin_v1',origin);else localStorage.removeItem('jobfit_commute_origin_v1');$('run').disabled=true;$('result').innerHTML='<div class="card loading">Kakao에서 경로를 확인하고 있습니다...</div>';try{const r=await fetch(COMMUTE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'route',originAddress:origin,destinations:[{id:'job',name:[company,title].filter(Boolean).join(' '),address:destination}]})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`조회 오류 (${r.status})`);const x=d.results?.[0]||{};$('result').innerHTML=`<section class="card"><h2>통근시간 참고</h2><div class="resolved"><b>출발지</b> ${esc(d.origin?.resolvedAddress||origin)}<br><b>근무지</b> ${esc(x.resolvedAddress||destination)}</div><div class="summary">${routeHtml('🚗 자동차',x.car)}${routeHtml('🚌 대중교통',x.transit)}</div><div class="notice">${esc(d.note||'경로시간은 참고값입니다. 실제 출퇴근 시간은 시간대와 교통상황에 따라 달라질 수 있습니다.')}<br>이 결과는 지원가능성 점수·판정·공고 정렬에 반영하지 않습니다.</div></section>`}catch(e){let msg=e.message||'경로를 확인하지 못했습니다.';if(/geocode_not_found|address_missing/i.test(msg))msg='주소를 찾지 못했습니다. 출발지·근무지를 더 정확한 주소로 입력해 주세요.';if(/kakao_local_disabled/i.test(msg))msg='Kakao Local API 사용 설정을 확인해야 합니다.';$('result').innerHTML=`<div class="error">${esc(msg)}</div>`}finally{$('run').disabled=false}};
</script>
</body>
</html>
