<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>고용24 정부지원일자리 API 등록</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:48px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.06)}h1{font-size:25px;margin:0 0 10px}.sub{color:#667085;line-height:1.65;margin:0 0 24px}.field{margin:18px 0}label{display:block;font-weight:800;margin-bottom:8px}input{width:100%;padding:14px 15px;border:1px solid #cfd4dc;border-radius:11px;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:15px;background:#1f63e9;color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.box{margin-top:18px;padding:14px 16px;border-radius:11px;display:none;line-height:1.6;white-space:pre-line}.ok{display:block;background:#ecfdf3;border:1px solid #abefc6;color:#067647}.err{display:block;background:#fff1f1;border:1px solid #fecaca;color:#b42318}.loading{display:block;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}.note{margin-top:16px;font-size:12.5px;line-height:1.6;color:#667085}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>고용24 정부지원일자리 API 등록</h1>
<p class="sub">발급받은 <b>정부지원일자리정보 API 인증키</b>만 입력하세요. 먼저 고용24 공식 API 연결을 확인한 뒤 Supabase Vault에 저장합니다.</p>
<div class="field"><label for="key">정부지원일자리정보 API 인증키</label><input id="key" type="password" autocomplete="off" placeholder="인증키 붙여넣기"></div>
<button id="btn" type="button">연결 테스트 후 저장</button>
<div id="result" class="box"></div>
<div class="note">인증키는 이 화면에서 서버로 바로 전송되며 화면에 다시 표시하지 않습니다. 저장이 끝나면 이 창을 닫아도 됩니다.</div>
</div></div>
<script>
const ENDPOINT='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/work24-govjob-setup-k8m4p2';
const b=document.getElementById('btn'),r=document.getElementById('result'),k=document.getElementById('key');
function show(c,t){r.className='box '+c;r.textContent=t}
b.onclick=async()=>{const key=k.value.trim();if(!key){show('err','인증키를 입력해 주세요.');return}b.disabled=true;show('loading','고용24 정부지원일자리 API 연결을 확인하고 있습니다...');try{const x=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const d=await x.json().catch(()=>({}));if(!x.ok||!d.ok)throw new Error(d.error||'등록에 실패했습니다.');k.value='';show('ok','등록 완료!\n정부지원일자리정보 API 연결이 확인되고 Vault에 저장되었습니다.\n이제 실제 데이터에 미래내일·일경험이 있는지 확인하면 됩니다.');b.textContent='등록 완료'}catch(e){show('err',e.message||'연결 테스트에 실패했습니다.');b.disabled=false}}
</script>
</body>
</html>
