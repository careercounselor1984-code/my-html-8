<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>고용24 정부지원일자리 데이터 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:48px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.06)}h1{font-size:25px;margin:0 0 10px}.sub{color:#667085;line-height:1.65;margin:0 0 24px}.field{margin:18px 0}label{display:block;font-weight:800;margin-bottom:8px}input{width:100%;padding:14px 15px;border:1px solid #cfd4dc;border-radius:11px;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:15px;background:#1f63e9;color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.box{margin-top:18px;padding:14px 16px;border-radius:11px;display:none;line-height:1.6}.ok{display:block;background:#ecfdf3;border:1px solid #abefc6;color:#067647}.err{display:block;background:#fff1f1;border:1px solid #fecaca;color:#b42318}.loading{display:block;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}.note{margin-top:16px;font-size:12.5px;line-height:1.6;color:#667085}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border:1px solid #dfe6ef;border-radius:10px;padding:11px;text-align:center}.stat b{display:block;font-size:22px;color:#1f63e9}.stat span{font-size:12px;color:#667085}.resultList{margin-top:12px}.item{background:#fff;border:1px solid #dfe6ef;border-radius:10px;padding:11px;margin-top:7px}.item strong{display:block;font-size:13px}.meta{font-size:11px;color:#667085;margin-top:4px}.pill{display:inline-block;font-size:10px;font-weight:800;background:#edf4ff;color:#2457d6;border-radius:999px;padding:3px 6px;margin:4px 4px 0 0}@media(max-width:620px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>정부지원일자리 실제 데이터 확인</h1>
<p class="sub">등록은 이미 완료되었습니다. 같은 인증키를 한 번만 다시 붙여넣으면 최근 120일 참여자모집정보에서 <b>미래내일 · 일경험 · 청년</b>이 실제로 잡히는지 확인합니다.</p>
<div class="field"><label for="key">정부지원일자리정보 API 인증키</label><input id="key" type="password" autocomplete="off" placeholder="인증키 붙여넣기"></div>
<button id="btn" type="button">실제 데이터 확인</button>
<div id="result" class="box"></div>
<div class="note">이 확인은 입력한 키로 고용24 API를 조회하는 용도이며, 화면에는 인증키를 다시 표시하지 않습니다.</div>
</div></div>
<script>
const endpoint='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/work24-govjob-setup-k8m4p2';
const btn=document.getElementById('btn'),result=document.getElementById('result'),keyInput=document.getElementById('key');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(kind,html){result.className='box '+kind;result.innerHTML=html}
function render(d){const x=d.diagnosis||{},s=x.keywordSummary||{},rows=x.participant?.matches||[];let html=`<b>확인 완료</b><div class="summary"><div class="stat"><b>${Number(s['미래내일']||0)}</b><span>미래내일</span></div><div class="stat"><b>${Number(s['일경험']||0)}</b><span>일경험</span></div><div class="stat"><b>${Number(s['청년']||0)}</b><span>청년</span></div></div>`;if(rows.length){html+=`<div class="resultList"><b>실제 잡힌 모집정보</b>${rows.slice(0,20).map(r=>`<div class="item"><strong>${esc(r.rcritPblancNm||r.bsnsNm||'모집정보')}</strong><div class="meta">${esc([r.bsnsNm,r.manageInsttNm||r.executeInsttNm,r.workAreaCodeNm,r.registDt].filter(Boolean).join(' · '))}</div><div>${(r.matchedKeywords||[]).map(k=>`<span class="pill">${esc(k)}</span>`).join('')}</div></div>`).join('')}</div>`}else{html+=`<div style="margin-top:10px">최근 120일 참여자모집정보에서는 해당 키워드가 확인되지 않았습니다.</div>`}if(x.participant?.truncatedWindows>0)html+=`<div class="meta" style="margin-top:10px">※ 일부 조회구간은 API 표시건수 제한이 있어 전체 누락 가능성이 있습니다.</div>`;return html}
btn.onclick=async()=>{const key=keyInput.value.trim();if(!key){show('err','인증키를 입력해 주세요.');return}btn.disabled=true;show('loading','실제 정부지원일자리 데이터를 확인하고 있습니다. 10~30초 정도 걸릴 수 있습니다.');try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'diagnose',key})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'조회에 실패했습니다.');keyInput.value='';show('ok',render(d));btn.textContent='확인 완료'}catch(e){show('err',esc(e.message||'조회에 실패했습니다.'));btn.disabled=false}}
</script>
</body>
</html>
