<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>채용공고 추가분석</title>
<style>
:root{--blue:#2457d6;--navy:#172b4d;--bg:#f5f7fb;--line:#e2e7ef;--muted:#667085;--green:#067647;--greenbg:#ecfdf3;--amber:#9a6700;--amberbg:#fff8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#172033;line-height:1.55}.top{background:linear-gradient(135deg,#142e54,#2457d6);color:#fff;padding:25px 18px}.topin,.wrap{max-width:920px;margin:auto}.eyebrow{font-size:11px;font-weight:850;color:#cfe0ff}.top h1{font-size:24px;margin:4px 0 5px}.top p{margin:0;color:#e4ecff;font-size:13px}.wrap{padding:18px 14px 42px}.tools{display:flex;justify-content:flex-end;gap:7px;margin-bottom:10px}.btn{border:1px solid #cbd5e1;background:#fff;color:#344054;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:11px;box-shadow:0 5px 18px rgba(28,46,76,.04)}.card h2{font-size:16px;color:var(--navy);margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kv{border:1px solid #edf0f4;border-radius:9px;background:#fbfcfe;padding:9px 10px;font-size:12px}.kv b{display:block;font-size:10px;color:#7a8699;margin-bottom:2px}.lead{background:#f7faff;border:1px solid #dce7fb;border-radius:11px;padding:12px 13px;font-size:13px;white-space:pre-line}.item{padding:10px 0;border-top:1px solid #edf0f4}.item:first-child{border-top:0;padding-top:0}.item strong{display:block;font-size:13px}.small{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850;background:#edf4ff;color:#2457d6;margin:2px 4px 2px 0}.pill.green{background:var(--greenbg);color:var(--green)}.notice{font-size:11.5px;color:#755b15;background:var(--amberbg);border:1px solid #f3d987;border-radius:10px;padding:10px 11px}.loading{text-align:center;padding:50px 10px;color:var(--blue);font-weight:800}.error{background:#fff0ee;border:1px solid #f1b8b2;color:#96271f;border-radius:11px;padding:13px}.sourceLink{display:inline-block;margin-top:7px;color:var(--blue);font-weight:800;text-decoration:none;font-size:12px}.mutedBox{padding:12px;border:1px dashed #cfd7e3;border-radius:10px;color:var(--muted);font-size:12px}.ncsRow{border:1px solid #e5eaf1;border-radius:10px;padding:11px;margin-bottom:7px}.ncsRow strong{font-size:13px}.ncsMeta{font-size:10.5px;color:var(--muted);margin-top:3px}.recent a{color:#344054;text-decoration:none}.recent a:hover{color:var(--blue);text-decoration:underline}@media(max-width:640px){.grid{grid-template-columns:1fr}.top h1{font-size:21px}.card{padding:14px}.tools{justify-content:stretch}.tools .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="eyebrow">채용 지원가능성 분석센터 · 추가분석</div><h1 id="pageTitle">분석 중</h1><p id="pageSub"></p></div></header>
<main class="wrap"><div class="tools"><a id="official" class="btn primary" target="_blank" rel="noopener" style="display:none">공식 공고 열기 ↗</a><button class="btn" onclick="window.close()">창 닫기</button></div><div id="content" class="loading">공개 데이터를 확인하고 있습니다...</div></main>
<script>
const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/job-analysis-bundle',q=new URLSearchParams(location.search),$=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mode=q.get('mode')||'company',labels={company:'기업분석',institution:'기관분석',role:'직무분석',ncs:'NCS 보기'};$('pageTitle').textContent=labels[mode]||'추가분석';$('pageSub').textContent=[q.get('company'),q.get('title')].filter(Boolean).join(' · ');const url=q.get('url')||'';if(/^https?:\/\//i.test(url)){$('official').href=url;$('official').style.display='inline-block'}
function kv(k,v){return v?`<div class="kv"><b>${esc(k)}</b>${esc(v)}</div>`:''}function fmtDate(v){const s=String(v||'').replace(/\D/g,'');return s.length>=8?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`:(v||'')}function recent(rows){if(!rows?.length)return'<div class="mutedBox">최근 공고 이력은 별도로 확인되지 않았습니다.</div>';return `<div class="recent">${rows.map(x=>`<div class="item"><strong>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</strong><div class="small">${esc([fmtDate(x.startDate),fmtDate(x.endDate),x.region,x.type].filter(Boolean).join(' · '))}</div></div>`).join('')}</div>`}
function institution(d){const j=d.job;return `<section class="card"><h2>기관·채용 핵심</h2><div class="grid">${kv('기관',j.company)}${kv('공공데이터 출처',j.source==='ALIO'?'ALIO':j.source==='CLEANEYE'?'클린아이':j.source)}${kv('근무지역',j.region)}${kv('채용형태',j.recruitType||j.employmentType)}${kv('채용인원',j.headcount?j.headcount+'명':'')}${kv('학력',j.education)}</div>${j.ncsNames?.length?`<div style="margin-top:10px">${j.ncsNames.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}</section><section class="card"><h2>현재 공고에서 확인할 내용</h2><div class="lead">${esc(j.qualification||j.jobText||j.title||'공식 공고문을 확인해 주세요.')}</div>${j.preference?`<div class="small" style="margin-top:8px"><b>우대조건</b> · ${esc(j.preference)}</div>`:''}</section><section class="card"><h2>최근 채용공고 흐름</h2>${recent(d.recentPostings)}</section><div class="notice">기관분석은 ALIO·클린아이 등 공개 채용정보를 요약한 참고자료입니다. 기관 경영평가나 재무상태를 임의로 추정하지 않습니다.</div>`}
function company(d){const j=d.job,a=d.analysis||{},dart=a.dart||{},ce=a.company||{},nps=ce.nps||{},n=nps.selected||nps.companyWideCandidate;let dartHtml='';if(dart.available){dartHtml=`<div class="grid">${kv('공식 법인명',dart.corpName)}${kv('상장명',dart.stockName)}${kv('대표자',dart.ceoName)}${kv('설립일',fmtDate(dart.establishedDate))}${kv('본점 주소',dart.address)}${kv('홈페이지',dart.homepage)}${kv('종목코드',dart.stockCode)}${kv('업종코드',dart.industryCode)}</div>`}else dartHtml='<div class="mutedBox">OpenDART에서 고신뢰 법인정보를 자동 확정하지 못했습니다. 회사 공식 홈페이지·공고를 우선 확인하세요.</div>';let npsHtml=n?`<div class="grid">${kv('사업장명',n.name)}${kv('자료월',n.dataMonth)}${kv('공개 가입자수 참고',Number(n.subscriberCount||0).toLocaleString('ko-KR')+'명')}${kv('신규취득 참고',Number(n.newAcquisitions||0).toLocaleString('ko-KR')+'명')}${kv('상실 참고',Number(n.lossCount||0).toLocaleString('ko-KR')+'명')}${kv('업종',n.industryName)}${kv('사업장 주소',n.roadAddress||n.lotAddress)}</div>`:'<div class="mutedBox">회사명이 정확히 일치하는 국민연금 사업장 공개자료를 자동 확정하지 못했습니다.</div>';return `<section class="card"><h2>기업 기본정보 · OpenDART</h2>${dartHtml}</section><section class="card"><h2>고용 참고지표 · 국민연금 공개자료</h2>${npsHtml}<div class="small" style="margin-top:8px">가입자수·신규취득·상실 수치는 신고자료 기반 참고지표이며 실제 임직원·채용·퇴사 인원으로 단정하지 않습니다.</div></section>${d.recentPostings?.length?`<section class="card"><h2>최근 연결된 채용공고</h2>${recent(d.recentPostings)}</section>`:''}<div class="notice">기업분석은 공개정보 확인용입니다. 기업의 안정성·성장성이나 지원 여부를 자동 판정하지 않으며 지원가능성 점수에도 반영하지 않습니다.</div>`}
function role(d){const a=d.analysis||{},units=a.duty?.units||[],ncs=a.taxonomy?.ncs?.items||[];const unitsHtml=units.length?units.slice(0,4).map(u=>`<div class="ncsRow"><strong>${esc(u.unitName||'관련 직무')}</strong><div class="ncsMeta">${esc([u.abilityUnitCode,[u.ncsLargeName,u.ncsMiddleName,u.ncsSmallName].filter(Boolean).join(' › ')].filter(Boolean).join(' · '))}</div>${u.definition?`<div class="small">${esc(u.definition)}</div>`:''}</div>`).join(''):ncs.slice(0,4).map(x=>`<div class="ncsRow"><strong>${esc(x.name)}</strong><div class="ncsMeta">NCS ${esc(x.code)}${x.level?' · 수준 '+esc(x.level):''}</div></div>`).join('');return `<section class="card"><h2>공고에서 읽은 실제 업무</h2><div class="lead">${esc(a.jobText||d.job.jobText||d.job.title)}</div></section><section class="card"><h2>관련 직무정보</h2>${unitsHtml||'<div class="mutedBox">관련 표준직무 정보를 자동으로 확정하지 못했습니다. 공고의 실제 담당업무를 우선 확인하세요.</div>'}</section><div class="notice">직무분석은 공고 업무내용과 고용24·NCS 직무정보를 연결한 참고자료입니다. 직무명이 비슷해도 실제 수행업무가 다르면 원 공고를 우선합니다.</div>`}
function ncs(d){const a=d.analysis||{},t=a.taxonomy||{},items=t.ncs?.items||[],sqf=t.sqf?.items||[];const ncsHtml=items.length?items.slice(0,8).map(x=>`<div class="ncsRow"><strong>${esc(x.name)}</strong><div class="ncsMeta">${esc(['NCS '+x.code,x.level?'수준 '+x.level:'',x.trainingHours?'훈련 '+x.trainingHours+'시간':''].filter(Boolean).join(' · '))}</div>${x.matchedIntent?.length?`<div>${x.matchedIntent.map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</div>`:''}</div>`).join(''):'<div class="mutedBox">관련 NCS 능력단위를 자동으로 확정하지 못했습니다.</div>';const sqfHtml=sqf.length?`<section class="card"><h2>산업직무 수준 참고 · SQF</h2>${sqf.slice(0,4).map(x=>`<div class="item"><strong>${esc(x.duty||x.job)}</strong><div class="small">${esc([x.industry,x.level?'수준 '+x.level:'',x.qualification].filter(Boolean).join(' · '))}</div></div>`).join('')}</section>`:'';return `<section class="card"><h2>관련 NCS 능력단위</h2>${ncsHtml}</section>${sqfHtml}<div class="notice">NCS·SQF는 직무 이해와 준비방향을 위한 보조근거입니다. 채용기관이 공고에서 지정한 NCS 직무기술서가 있으면 그 자료를 최우선으로 확인하세요.</div>`}
async function run(){try{const body={mode,source:q.get('source')||'',jobKey:q.get('jobKey')||'',company:q.get('company')||'',title:q.get('title')||'',region:q.get('region')||'',companyClass:q.get('companyClass')||'',jobCont:(q.get('jobCont')||'').slice(0,500),url};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`조회 오류 (${r.status})`);$('content').className='';$('content').innerHTML=mode==='institution'?institution(d):mode==='company'?company(d):mode==='role'?role(d):ncs(d)}catch(e){$('content').className='error';$('content').textContent=e.message||'분석자료를 불러오지 못했습니다.'}}run();
</script>
</body>
</html>
