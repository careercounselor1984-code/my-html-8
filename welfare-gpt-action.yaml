openapi: 3.1.0
info:
  title: Welfare Policy Search and Eligibility API
  version: 2.0.0
  description: Search Korean welfare policies and perform conservative second-stage eligibility screening using only user-provided facts.
servers:
  - url: https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-gpt-router
paths:
  /:
    post:
      operationId: searchOrDiagnoseWelfarePolicies
      summary: Search policies or run second-stage eligibility screening
      description: Use action=search for first-stage policy search and action=diagnose for follow-up eligibility screening. For broad requests use interest=전체. Never infer missing personal facts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [search, diagnose]
                age:
                  type: integer
                  minimum: 0
                  maximum: 120
                gender:
                  type: string
                  enum: [선택 안함, 여성, 남성]
                sido:
                  type: string
                  description: 'Example: 울산광역시'
                sigungu:
                  type: string
                  description: 'Example: 북구'
                employmentStatus:
                  type: string
                maritalStatus:
                  type: string
                  enum: [선택 안함, 미혼, 기혼, 기타]
                householdType:
                  type: string
                  enum: [선택 안함, 1인가구, 부부, 부부+자녀, 한부모, 조손가구, 기타]
                hasChildren:
                  type: string
                  enum: [선택 안함, 없음, 있음]
                childrenAges:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 30
                  maxItems: 8
                interest:
                  type: string
                  enum: [전체, 취업·훈련, 주거, 금융, 생계, 의료, 심리·마음건강, 돌봄, 교육·문화, 청년정책]
                keyword:
                  type: string
                  description: Use only concepts explicitly stated by the user.
                annualIncome:
                  type: integer
                  minimum: 0
                  description: Annual personal income in 10,000 KRW units.
                monthlyIncome:
                  type: integer
                  minimum: 0
                  description: Current personal monthly income in KRW.
                livingWithParents:
                  type: boolean
                noHome:
                  type: boolean
                  description: true means the user explicitly states they do not own a home.
                housingType:
                  type: string
                  enum: [부모님 집, 월세, 전세, 자가, 무상거주, 기타]
                rentDeposit:
                  type: integer
                  minimum: 0
                monthlyRent:
                  type: integer
                  minimum: 0
                savings:
                  type: integer
                  minimum: 0
                vehicleValue:
                  type: integer
                  minimum: 0
                assetsTotal:
                  type: integer
                  minimum: 0
                householdSize:
                  type: integer
                  minimum: 1
                  maximum: 20
                householdMonthlyIncome:
                  type: integer
                  minimum: 0
                priorityWelfareStatus:
                  type: array
                  items:
                    type: string
                  description: Explicit statuses only, such as 기초생활수급, 차상위, 한부모, 근로장려금 자격, or 해당 없음.
                crisisReason:
                  type: string
                  description: Explicit emergency reason or 없음.
                medicalExpenseNeed:
                  type: boolean
                creditNeed:
                  type: boolean
                creditStatus:
                  type: string
              required: [action]
      responses:
        '200':
          description: Successful policy search or eligibility screening response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request
        '500':
          description: Server error
