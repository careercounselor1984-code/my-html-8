openapi: 3.1.0
info:
  title: Welfare Policy Search and Eligibility API
  version: 2.3.0
  description: Separate first-stage welfare discovery from detailed eligibility diagnosis using only user-provided facts.
servers:
  - url: https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-gpt-router
paths:
  /search:
    post:
      operationId: searchWelfarePolicies
      summary: First-stage welfare policy search only
      description: Use only before detailed income, housing, asset, welfare, crisis, medical or credit facts are known. If those facts are already provided, use diagnoseWelfareEligibility instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                age:
                  type: integer
                  minimum: 0
                  maximum: 120
                gender:
                  type: string
                  enum: [선택 안함, 여성, 남성]
                sido:
                  type: string
                sigungu:
                  type: string
                employmentStatus:
                  type: string
                maritalStatus:
                  type: string
                  enum: [선택 안함, 미혼, 기혼, 기타]
                householdType:
                  type: string
                  enum: [선택 안함, 1인가구, 부부, 부부+자녀, 한부모, 조손가구, 기타]
                hasChildren:
                  type: string
                  enum: [선택 안함, 없음, 있음]
                childrenAges:
                  type: array
                  items:
                    type: integer
                interest:
                  type: string
                  enum: [전체, 취업·훈련, 주거, 금융, 생계, 의료, 심리·마음건강, 돌봄, 교육·문화, 청년정책]
                keyword:
                  type: string
      responses:
        '200':
          description: First-stage MASTER policy search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                  masterResult:
                    type: boolean
                  interest:
                    type: string
                  total:
                    type: integer
                  presentationPlan:
                    type: object
                    additionalProperties: true
                  services:
                    type: array
                    description: The sole first-stage MASTER list for this search response.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        displayRank:
                          type: integer
                        recommendationTier:
                          type: string
                        recommendationReason:
                          type: string
                        officialUrlLine:
                          type: string
                        verifiedBenefitText:
                          type: string
                      additionalProperties: true
                  outputDirective:
                    type: string
                additionalProperties: true
        '400':
          description: Bad request
        '500':
          description: Server error

  /diagnose:
    post:
      operationId: diagnoseWelfareEligibility
      summary: Final welfare eligibility diagnosis from detailed profile
      description: Use whenever income, parent co-residence, housing, assets, household income/assets, welfare status, crisis, medical expense or credit facts are provided. Do not call search first. This response is authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                age:
                  type: integer
                  minimum: 0
                  maximum: 120
                gender:
                  type: string
                  enum: [선택 안함, 여성, 남성]
                sido:
                  type: string
                sigungu:
                  type: string
                employmentStatus:
                  type: string
                maritalStatus:
                  type: string
                  enum: [선택 안함, 미혼, 기혼, 기타]
                householdType:
                  type: string
                  enum: [선택 안함, 1인가구, 부부, 부부+자녀, 한부모, 조손가구, 기타]
                hasChildren:
                  type: string
                  enum: [선택 안함, 없음, 있음]
                childrenAges:
                  type: array
                  items:
                    type: integer
                interest:
                  type: string
                  enum: [전체, 취업·훈련, 주거, 금융, 생계, 의료, 심리·마음건강, 돌봄, 교육·문화, 청년정책]
                keyword:
                  type: string
                annualIncome:
                  type: integer
                  minimum: 0
                monthlyIncome:
                  type: integer
                  minimum: 0
                livingWithParents:
                  type: boolean
                noHome:
                  type: boolean
                  description: true only when the user explicitly says they do not own a home.
                housingType:
                  type: string
                  enum: [부모님 집, 월세, 전세, 자가, 무상거주, 기타]
                rentDeposit:
                  type: integer
                  minimum: 0
                monthlyRent:
                  type: integer
                  minimum: 0
                savings:
                  type: integer
                  minimum: 0
                vehicleValue:
                  type: integer
                  minimum: 0
                assetsTotal:
                  type: integer
                  minimum: 0
                householdSize:
                  type: integer
                  minimum: 1
                  maximum: 20
                householdMonthlyIncome:
                  type: integer
                  minimum: 0
                householdAssetsTotal:
                  type: integer
                  minimum: 0
                priorityWelfareStatus:
                  type: array
                  description: Explicit welfare qualifications or explicit none.
                  items:
                    type: string
                crisisReason:
                  type: string
                  description: Explicit crisis reason or explicit none.
                medicalExpenseNeed:
                  type: boolean
                creditNeed:
                  type: boolean
                creditStatus:
                  type: string
                  description: Use 모름 when the user explicitly says the credit condition is unknown.
      responses:
        '200':
          description: Authoritative compact eligibility diagnosis
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                  compactResponse:
                    type: boolean
                  compactResponseVersion:
                    type: string
                  profileEcho:
                    type: object
                    additionalProperties: true
                  assessmentCounts:
                    type: object
                    properties:
                      신청 가능성 높음:
                        type: integer
                      조건 확인 필요:
                        type: integer
                      현재 불가 가능성 높음:
                        type: integer
                    additionalProperties: true
                  sectionLock:
                    type: object
                    description: Authoritative final section membership. Never move an item to another section.
                    properties:
                      highRanks:
                        type: array
                        items:
                          type: integer
                      conditionalRanks:
                        type: array
                        items:
                          type: integer
                      lowRanks:
                        type: array
                        items:
                          type: integer
                      highNames:
                        type: array
                        items:
                          type: string
                      conditionalNames:
                        type: array
                        items:
                          type: string
                      lowNames:
                        type: array
                        items:
                          type: string
                      rule:
                        type: string
                    additionalProperties: true
                  diagnosisMasterLock:
                    type: object
                    additionalProperties: true
                  finalDisplayItems:
                    type: array
                    description: Sole authoritative final diagnosis list. Output every item exactly once and keep lockedSection, eligibilityStatus, displayRank and name unchanged.
                    items:
                      type: object
                      properties:
                        displayRank:
                          type: integer
                        name:
                          type: string
                        eligibilityStatus:
                          type: string
                          enum: [신청 가능성 높음, 조건 확인 필요, 현재 불가 가능성 높음]
                        lockedSection:
                          type: string
                          enum: [신청 가능성 높음, 조건 확인 필요, 현재 불가 가능성 높음]
                          description: Output this item only in this section. Never reinterpret it.
                        reason:
                          type: string
                        practicalPriority:
                          type: string
                        caution:
                          type: string
                        officialUrlLine:
                          type: string
                        verifiedBenefitText:
                          type: string
                        detailScreening:
                          type: object
                          additionalProperties: true
                        executionGuide:
                          type: object
                          additionalProperties: true
                      additionalProperties: true
                  nextQuestionRound:
                    type: integer
                  nextQuestions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  verifiedPolicyFacts:
                    type: object
                    additionalProperties: true
                  outputDirective:
                    type: string
                    description: Mandatory rendering instructions for the final answer.
                  routerDecision:
                    type: object
                    properties:
                      originalAction:
                        type: string
                      effectiveAction:
                        type: string
                      autoPromoted:
                        type: boolean
                      signalCount:
                        type: integer
                      routeSource:
                        type: string
                    additionalProperties: true
                additionalProperties: true
        '400':
          description: Bad request
        '500':
          description: Server error
