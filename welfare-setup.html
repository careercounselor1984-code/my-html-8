<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복지 API 연결 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:30px auto;padding:0 14px 40px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px #1018280a}h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.sub{font-size:12px;color:#667085;line-height:1.6}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2457d6;color:#fff;font-weight:850;cursor:pointer;margin-top:10px}.btn.green{background:#067647}.ok,.warn,.err,.box{padding:12px;border-radius:10px;font-size:12px;line-height:1.65;margin-top:10px}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.box{background:#eff8ff;color:#175cd3}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:12px;max-height:300px;overflow:auto;font-size:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>복지 API 연결 설정</h1><div class="sub">공공데이터포털 인증키는 이 화면에서만 입력하고 저장하지 않습니다. 채팅으로 보내지 않아도 됩니다.</div><div class="box">먼저 <b>중앙부처 복지서비스</b>를 테스트하고, 성공하면 <b>지자체 복지서비스</b>를 테스트하세요.</div></div><div class="row"><div class="card"><h2>1. 중앙부처 복지서비스</h2><label>공공데이터포털 인증키</label><input id="natKey" type="password" autocomplete="off" placeholder="일반 인증키 입력"><button class="btn" id="natBtn">중앙부처 연결 테스트</button><div id="natStatus"></div></div><div class="card"><h2>2. 지자체 복지서비스</h2><label>공공데이터포털 인증키</label><input id="locKey" type="password" autocomplete="off" placeholder="일반 인증키 입력"><button class="btn green" id="locBtn">지자체 연결 테스트</button><div id="locStatus"></div></div></div><div class="card"><h2>테스트 결과</h2><div class="sub">연결되면 수신 건수와 첫 응답 일부가 표시됩니다.</div><pre id="result">아직 테스트하지 않았습니다.</pre></div><div class="card"><a href="welfare-policy.html" style="text-decoration:none;font-weight:800;color:#2457d6">← 복지·정책 연계 지원센터로 돌아가기</a></div></div><script>const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-proxy';const $=id=>document.getElementById(id);async function call(action,key){const r=await fetch(API,{method:'POST',body:JSON.stringify({action,serviceKey:key})});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('서버 응답을 읽지 못했습니다.')}if(!r.ok||!d.ok)throw Object.assign(new Error(d.error||'연결 실패'),{data:d});return d}function showStatus(id,type,html){$(id).innerHTML='<div class="'+type+'">'+html+'</div>'}async function run(type){const isNat=type==='national',key=$(isNat?'natKey':'locKey').value.trim(),sid=isNat?'natStatus':'locStatus',btn=$(isNat?'natBtn':'locBtn');if(!key)return showStatus(sid,'warn','인증키를 입력해주세요.');btn.disabled=true;showStatus(sid,'box','연결 확인 중입니다...');$('result').textContent='API 응답 대기 중...';try{const d=await call(isNat?'national_test':'local_test',key);showStatus(sid,'ok','<b>연결 성공</b><br>응답 건수 확인: '+(d.count||'확인됨'));$('result').textContent=JSON.stringify({count:d.count,sample:d.sample},null,2)}catch(e){showStatus(sid,'err','<b>연결 실패</b><br>'+(e.message||e));$('result').textContent=JSON.stringify(e.data||{error:String(e)},null,2)}finally{btn.disabled=false}}$('natBtn').addEventListener('click',()=>run('national'));$('locBtn').addEventListener('click',()=>run('local'));</script></body></html>
