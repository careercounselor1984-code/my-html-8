<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채용 지원가능성 분석센터</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{background:#14213a;color:#fff;padding:18px}.top,.wrap{max-width:1160px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:22px;margin:0}.sub,.meta{font-size:12px;color:#667085;line-height:1.55}header .sub{color:#cbd5e1}.state{font-size:12px;background:#203454;padding:7px 10px;border-radius:99px}.wrap{padding:18px 14px 40px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #e4e7ec;background:#fff;padding:9px 11px;border-radius:9px;font-weight:800;cursor:pointer}.tab.on{background:#2457d6;color:#fff}.panel{display:none}.panel.on{display:block}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;box-shadow:0 3px 14px #1018280a}.card+.card{margin-top:14px}.kpi{font-size:30px;font-weight:900}h2{font-size:18px;margin:0 0 10px}label{display:block;font-size:12px;font-weight:800;margin:9px 0 5px}input,select{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid #e4e7ec;border-radius:10px;padding:11px;margin-bottom:8px;background:#fff}.pick{cursor:pointer}.sel{border:2px solid #2457d6;background:#f8faff}.new{border-left:5px solid #6941c6}.list{max-height:470px;overflow:auto;margin-top:10px}.pill{display:inline-block;background:#f2f4f7;border-radius:99px;padding:3px 7px;font-size:11px;margin:3px 3px 0 0}.pill.n{background:#f4ebff;color:#6941c6;font-weight:900}.box,.ok,.warn,.err{padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.65;margin-top:10px}.box{background:#eff8ff;color:#175cd3}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.role{background:#f7f9ff;border:1px solid #bfd4ff;border-radius:10px;padding:11px;margin-top:10px}.btn{display:inline-block;border:0;border-radius:8px;padding:9px 12px;font-weight:800;font-size:12px;text-decoration:none;background:#2457d6;color:#fff;cursor:pointer;margin-top:10px}.result{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;border-top:6px solid #f79009}.result.good{border-top-color:#067647}.result.bad{border-top-color:#b42318}.verdict{font-size:24px;font-weight:950}.check{display:grid;grid-template-columns:82px 110px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #e4e7ec;font-size:13px}.status{font-size:11px;font-weight:900;border-radius:99px;padding:4px 7px;text-align:center}.sok{background:#ecfdf3;color:#067647}.sw{background:#fff6ed;color:#b54708}.sbad{background:#fef3f2;color:#b42318}.sna{background:#f2f4f7;color:#667085}@media(max-width:850px){.grid4,.grid2,.row2{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.check{grid-template-columns:78px 1fr}.check span:last-child{grid-column:2}}</style></head>
<body><header><div class="top"><div><h1>채용 지원가능성 분석센터 <span style="font-size:12px;color:#93c5fd">온라인 v1.3</span></h1><div class="sub">ALIO 자동수집 · 직무별 지원요건 · 대기업 연동 준비</div></div><div id="state" class="state">DB 연결 중</div></div></header>
<div class="wrap"><div class="tabs"><button class="tab on" data-t="home">현황</button><button class="tab" data-t="check">📋 이 공고 지원 가능?</button><button class="tab" data-t="new">🔔 신규 <span id="nb"></span></button><button class="tab" data-t="corp">🏢 대기업·민간</button></div>
<section id="home" class="panel on"><div class="grid4"><div class="card"><div class="sub">누적 공고이력</div><div id="ka" class="kpi">0</div></div><div class="card"><div class="sub">현재 진행</div><div id="ko" class="kpi">0</div></div><div class="card"><div class="sub">미확인 신규</div><div id="kn" class="kpi">0</div></div><div class="card"><div class="sub">대기업·민간 DB</div><div id="kc" class="kpi">0</div></div></div><div class="card"><h2>ALIO 자동갱신</h2><div class="ok"><b>평일 08:30 / 12:00 / 16:00 자동 확인</b><br>사이트를 닫아도 서버에서 갱신됩니다.</div></div></section>
<section id="check" class="panel"><div class="grid2"><div class="card"><h2>1. 공고 선택</h2><div class="row2"><div><label>기관/공고</label><input id="q" placeholder="예: 근로복지공단"></div><div><label>지역</label><input id="r" placeholder="예: 울산"></div></div><div id="pick" class="list"></div></div><div class="card"><h2>2. 지원직무 선택</h2><div id="jobinfo" class="sub">왼쪽에서 공고를 선택하세요.</div></div></div><div class="card"><h2>3. 지원자 정보</h2><div class="row2"><div><label>학력</label><select id="edu"><option>고졸</option><option>전문대졸</option><option selected>대졸</option><option>석사</option><option>박사</option></select></div><div><label>관련경력(개월)</label><input id="exp" type="number" value="0"></div></div><div class="row2"><div><label>전공</label><input id="major" placeholder="예: 전기공학"></div><div><label>자격증</label><input id="certs" placeholder="예: 정보처리기사, 사회복지사2급"></div></div><button class="btn" onclick="runCheck()">지원 가능 여부 분석</button></div><div id="result" style="margin-top:14px"></div></section>
<section id="new" class="panel"><div class="card"><h2>🔔 신규 공고</h2><button class="btn" onclick="seenAll()">현재 공고 모두 확인</button><div id="newsum"></div><div id="newlist" style="margin-top:10px"></div></div></section>
<section id="corp" class="panel"><div class="card"><h2>🏢 대기업·민간기업</h2><div class="box">사람인 API 승인 후 상장기업 공고가 자동으로 추가됩니다.</div><div id="corplist" style="margin-top:10px"></div></div><div class="card"><h2>공식 채용사이트 감시목록</h2><div id="watch"></div></div></section></div>
<script>
const A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvd3hsYWl5anhrbnFjY291Z2hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzU4MjAsImV4cCI6MjEwMjAxMTgyMH0.63dtBVK6jsqXtgK3jyVvBZLkohAxwG0AKWg86MoE7jg",P="https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/alio-proxy",S="jobfit_seen_v3";let jobs=[],corp=[],watchs=[],sel=null,role="";const ER={고졸:1,전문대졸:2,대졸:3,석사:4,박사:5};
const E=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));const N=s=>String(s??"").toLowerCase().replace(/[\s·ㆍ_\-()\[\]{}]/g,"");const T=s=>String(s??"").split(/[,/|]/).map(x=>x.trim()).filter(Boolean);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.t))});q.oninput=r.oninput=()=>renderPick();
async function api(body){let x=await fetch(P,{method:'POST',headers:{'Content-Type':'application/json',apikey:A,Authorization:'Bearer '+A},body:JSON.stringify(body)}),t=await x.text(),d;try{d=JSON.parse(t)}catch{throw Error('서버 응답 해석 실패')}if(!x.ok)throw Error(d.error||x.status);return d}
function openJ(j){if(j.ongoing_yn==='N')return false;let s=String(j.end_date||'').replace(/\D/g,'');return !(s.length===8&&new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),23,59,59)<new Date())}function fresh(j){let s=localStorage.getItem(S);return !!s&&new Date(j.first_seen_at)>new Date(s)}function news(){return jobs.filter(fresh).sort((a,b)=>new Date(b.first_seen_at)-new Date(a.first_seen_at))}
function roles(j){let q=String(j?.qualification||'').replace(/\r/g,''),a=[];for(let m of q.matchAll(/^\s*\[([^\]\n]{2,80})\]\s*$/gm)){let x=m[1].trim();if(x&&!a.includes(x))a.push(x)}let ls=q.split('\n'),section='';for(let line0 of ls){let line=line0.trim(),sm=line.match(/^\s*\(\d+\)\s*(.{2,80})$/);if(sm){section=sm[1].trim();continue}let bm=line.match(/^[ㅇ○●■□]\s*([^:：\n]{2,90})\s*[:：]\s*(.+)$/);if(!bm)continue;let name=bm[1].trim();if(/^(학력|연령|성별|병역|기타|상세|세부|공고문|우대|자격|경력|선발인원|선발방법|방법|응시과목)/.test(name))continue;let label=section?section+' > '+name:name;if(!a.includes(label))a.push(label)}return a}
function roleText(j,r){let q=String(j?.qualification||'').replace(/\r/g,'');if(!r)return q;let simple=r.includes(' > ')?r.split(' > ').pop():r,e=simple.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),bm=q.match(new RegExp('^\\s*\\['+e+'\\]\\s*([\\s\\S]*?)(?=^\\s*\\[[^\\]\\n]+\\]\\s*$|$)','m'));if(bm)return bm[1].trim();let targetSection=r.includes(' > ')?r.slice(0,r.lastIndexOf(' > ')):'',ls=q.split('\n'),section='',start=-1,end=ls.length,firstSection=ls.findIndex(x=>/^\s*\(\d+\)\s*/.test(x.trim()));for(let i=0;i<ls.length;i++){let line=ls[i].trim(),sm=line.match(/^\s*\(\d+\)\s*(.{2,80})$/);if(sm){section=sm[1].trim();continue}let rm=line.match(/^[ㅇ○●■□]\s*([^:：\n]{2,90})\s*[:：]\s*(.*)$/);if(rm&&rm[1].trim()===simple&&(!targetSection||section===targetSection)){start=i;break}}if(start>=0){for(let i=start+1;i<ls.length;i++){let line=ls[i].trim();if(/^\s*\(\d+\)\s*/.test(line)||/^[ㅇ○●■□]\s*([^:：\n]{2,90})\s*[:：]/.test(line)){end=i;break}}let common=firstSection>0?ls.slice(0,firstSection).join('\n').trim():'',specific=ls.slice(start,end).join('\n').trim();return [common,specific].filter(Boolean).join('\n\n')}return q}
function card(j,p){return '<div class="item '+(fresh(j)?'new ':'')+(p?'pick ':'')+(sel?.job_key===j.job_key?'sel':'')+'" '+(p?'data-k="'+E(j.job_key)+'" onclick="choose(this.dataset.k)"':'')+'><strong>'+(fresh(j)?'<span class="pill n">NEW</span> ':'')+E(j.company)+' · '+E(j.title)+'</strong><div class="meta">'+E((j.work_regions||[]).join(', ')||'지역 미확인')+' · '+E(j.education_raw||'')+' · 마감 '+E(j.end_date||'')+'</div></div>'}
async function load(){state.textContent='DB 불러오는 중';try{let [a,c,w]=await Promise.all([api({action:'jobs',limit:2000,ongoingOnly:false}),api({action:'corporate_jobs',limit:2000,ongoingOnly:false}),api({action:'watchlist'})]);jobs=a.jobs||[];corp=c.jobs||[];watchs=w.sources||[];if(!localStorage.getItem(S)&&jobs.length)localStorage.setItem(S,jobs.map(x=>x.first_seen_at).filter(Boolean).sort().at(-1)||new Date().toISOString());state.textContent='DB 연결됨';render()}catch(e){state.textContent='연결 오류';newsum.innerHTML='<div class="err">'+E(e.message)+'</div>'}}
function renderPick(){let qq=N(q.value),rr=N(r.value),xs=jobs.filter(openJ).filter(j=>(!qq||N([j.company,j.title,(j.ncs_names||[]).join(' '),j.qualification||''].join(' ')).includes(qq))&&(!rr||N((j.work_regions||[]).join(' ')).includes(rr))).slice(0,120);pick.innerHTML=xs.length?xs.map(j=>card(j,true)).join(''):'<div class="sub">검색 결과 없음</div>'}
function choose(k){sel=jobs.find(x=>x.job_key===k);role='';renderPick();let rs=roles(sel);if(rs.length===1)role=rs[0];jobinfo.innerHTML='<strong>'+E(sel.company)+' · '+E(sel.title)+'</strong><div class="role"><label>지원할 모집직무 / 전형</label>'+(rs.length?'<select onchange="role=this.value;result.innerHTML=\'\'">'+(rs.length>1?'<option value="">직무를 선택하세요</option>':'')+rs.map(x=>'<option '+(role===x?'selected':'')+'>'+E(x)+'</option>').join('')+'</select><div class="meta">공고의 직군·직무·전형 구분을 자동으로 추출했습니다.</div>':'<div class="warn">직무 자동 구분이 어려운 공고입니다. 공식 원문 확인이 필요합니다.</div>')+'</div>'+(sel.source_url?'<a class="btn" target="_blank" href="'+E(sel.source_url)+'">공식 원문</a>':'');result.innerHTML=''}
function iedu(v){let n=N(v);if(!n||n.includes('무관')||n.includes('제한없'))return'무관';if(n.includes('박사'))return'박사';if(n.includes('석사'))return'석사';if(n.includes('대졸')||n.includes('4년'))return'대졸';if(n.includes('전문대')||n.includes('초대졸'))return'전문대졸';if(n.includes('고졸'))return'고졸';return'무관'}
function runCheck(){if(!sel)return result.innerHTML='<div class="err">공고를 먼저 선택하세요.</div>';let rs=roles(sel);if(!rs.length)return result.innerHTML='<div class="warn">직무를 자동 분리하지 못해 판정을 보류합니다.</div>';if(rs.length>1&&!role)return result.innerHTML='<div class="warn">지원할 직무/전형을 먼저 선택하세요.</div>';let tx=roleText(sel,role),tn=N(tx),bad=[],warn=[],rows=[],pe=edu.value,px=+exp.value||0,pm=major.value.trim(),pc=T(certs.value),ed=iedu(/학력|대졸|고졸|전문대|석사|박사/.test(tx)?tx:sel.education_raw);if(/고졸전형/.test(role)&&pe!=='고졸'){rows.push(['bad','학력','고졸전형은 대학 재학·휴학·졸업예정·졸업자는 지원불가']);bad.push('고졸전형 학력')}else if(ed==='무관')rows.push(['ok','학력','제한 없음/무관']);else if((ER[pe]||0)>=(ER[ed]||0))rows.push(['ok','학력',pe+' → '+ed+' 충족']);else{rows.push(['bad','학력',ed+' 필요 / 현재 '+pe]);bad.push('학력')}let ym=tx.match(/(\d+)\s*년\s*이상/);if(ym){let need=+ym[1]*12;if(px>=need)rows.push(['ok','경력',ym[1]+'년 이상 충족']);else{rows.push(['bad','경력',ym[1]+'년 이상 필요']);bad.push('경력')}}else rows.push(['na','경력','별도 최소기간 자동확인 없음']);let hit=pc.filter(c=>tn.includes(N(c))).length;if(hit)rows.push(['ok','자격증','보유 자격증 '+hit+'개가 해당 직무요건과 일치']);else if(/기사|산업기사|기능사|자격증|면허|사회복지사|간호사/.test(tx)){rows.push(['warn','자격증','필수 자격·면허 확인 필요']);warn.push('자격증/면허')}else rows.push(['na','자격증','필수 자격증 자동확인 없음']);if(pm&&tn.includes(N(pm)))rows.push(['ok','전공','전공 관련 문구 일치']);else if(/전공|학과|관련학/.test(tx)){rows.push(['warn','전공','전공 제한 확인 필요']);warn.push('전공')}if(sel.disqualify_reason)warn.push('결격사유');let sts={ok:['충족','sok'],warn:['확인','sw'],bad:['미충족','sbad'],na:['미확인','sna']},cl=bad.length?'bad':warn.length?'':'good',vd=bad.length?'지원 어려움':warn.length?'지원 가능성 있음 · 확인 필요':'현재 확인된 조건상 지원 가능';result.innerHTML='<div class="result '+cl+'"><div class="verdict">'+(bad.length?'🔴':warn.length?'🟡':'🟢')+' '+vd+'</div><div class="meta">'+E(sel.company)+' · '+E(sel.title)+'<br><b>지원직무: '+E(role)+'</b></div><div style="margin-top:12px">'+rows.map(x=>'<div class="check"><span class="status '+sts[x[0]][1]+'">'+sts[x[0]][0]+'</span><b>'+E(x[1])+'</b><span>'+E(x[2])+'</span></div>').join('')+'</div>'+(warn.length?'<div class="warn"><b>지원 전 확인</b><br>• '+[...new Set(warn)].join('<br>• ')+'</div>':'')+'<details class="box"><summary><b>선택 직무의 자격요건 보기</b></summary><div style="white-space:pre-wrap;margin-top:8px">'+E(tx)+'</div></details>'+(sel.source_url?'<a class="btn" target="_blank" href="'+E(sel.source_url)+'">공식 공고 최종 확인</a>':'')+'</div>'}
function seenAll(){localStorage.setItem(S,jobs.map(x=>x.first_seen_at).filter(Boolean).sort().at(-1)||new Date().toISOString());render()}
function render(){let n=news();ka.textContent=jobs.length;ko.textContent=jobs.filter(openJ).length;kn.textContent=n.length;kc.textContent=corp.length;nb.textContent=n.length?'('+n.length+')':'';renderPick();newsum.innerHTML=n.length?'<div class="warn"><b>새 공고 '+n.length+'건</b></div>':'<div class="ok">미확인 신규공고 없음</div>';newlist.innerHTML=n.length?n.slice(0,200).map(j=>card(j,false)).join(''):'<div class="sub">신규공고가 생기면 표시됩니다.</div>';corplist.innerHTML=corp.length?corp.slice(0,200).map(j=>'<div class="item"><strong>'+E(j.company)+' · '+E(j.title)+'</strong><div class="meta">'+E((j.regions||[]).join(', '))+'</div></div>').join(''):'<div class="sub">사람인 승인 후 공고가 표시됩니다.</div>';watch.innerHTML=watchs.length?watchs.map(s=>'<div class="item"><strong>'+E(s.company_group)+' · '+E(s.company_name)+'</strong><a class="btn" target="_blank" href="'+E(s.careers_url)+'">공식 채용사이트</a></div>').join(''):'<div class="sub">감시목록 없음</div>'}load();
</script></body></html>
