<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복지·정책 연계 지원센터</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{background:#173b32;color:#fff;padding:18px}.top,.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:22px;margin:0}.sub,.meta{font-size:12px;line-height:1.6;color:#667085}header .sub{color:#d1fae5}.state{font-size:12px;background:#24584b;padding:7px 10px;border-radius:99px}.wrap{padding:18px 14px 48px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:16px;box-shadow:0 3px 14px #1018280a;margin-bottom:14px}h2{font-size:18px;margin:0 0 10px}label{display:block;font-size:12px;font-weight:800;margin:8px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;font:inherit}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:900;background:#16794e;color:#fff;cursor:pointer}.btn.secondary{background:#eef2f6;color:#172033;text-decoration:none;display:inline-block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ok,.box,.warn,.err{padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.65}.ok{background:#ecfdf3;color:#067647}.box{background:#eff8ff;color:#175cd3}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.result{border:1px solid #e4e7ec;border-radius:12px;padding:13px;margin-top:10px}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#f2f4f7;font-size:11px;font-weight:800;margin-right:4px}.pill.good{background:#ecfdf3;color:#067647}.pill.check{background:#fff6ed;color:#b54708}.pill.nat{background:#eef4ff;color:#2457d6}.pill.loc{background:#ecfdf3;color:#067647}.empty{padding:24px;text-align:center;color:#667085;background:#f8fafc;border-radius:12px}.share{border:2px solid #a6f4c5;background:#f6fef9;border-radius:14px;padding:16px;margin-top:14px}.share textarea{min-height:190px;line-height:1.65}.statusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.statusitem{border:1px solid #e4e7ec;border-radius:10px;padding:10px;font-size:12px}.ready{color:#067647;font-weight:900}.wait{color:#b54708;font-weight:900}.rtitle{font-size:15px;font-weight:900;margin:5px 0}.link{font-size:12px;font-weight:800;color:#2457d6;text-decoration:none}@media(max-width:760px){.grid4,.statusrow{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><header><div class="top"><div><h1>복지·정책 연계 지원센터 <span style="font-size:12px;color:#a7f3d0">v0.2</span></h1><div class="sub">나이·지역·상태만 간단히 입력하고 연계 가능한 복지서비스를 찾습니다.</div></div><div id="state" class="state">연결 확인 중</div></div></header><div class="wrap"><div class="card"><div class="actions" style="margin-top:0"><a class="btn secondary" href="job-fit-v18.html">← 채용 지원가능성 분석센터</a><a class="btn secondary" href="welfare-setup.html">⚙ 복지 API 설정</a></div></div><div class="card"><h2>1. 내담자 기본정보</h2><div class="grid4"><div><label>나이</label><input id="age" type="number" placeholder="예: 29"></div><div><label>시/도</label><select id="sido"><option>울산광역시</option><option>부산광역시</option><option>경상남도</option><option>서울특별시</option><option>경기도</option><option>기타</option></select></div><div><label>구·군</label><input id="sigungu" placeholder="예: 북구 (선택)"></div><div><label>취업상태</label><select id="work"><option>미취업</option><option>재직중</option><option>단시간근로</option><option>자영업</option><option>기타</option></select></div></div><div style="margin-top:8px"><label>관심분야</label><select id="topic"><option>전체</option><option>취업·훈련</option><option>주거</option><option>금융</option><option>생계</option><option>의료</option><option>돌봄</option><option>교육·문화</option><option>청년정책</option></select></div><div class="actions"><button class="btn" id="findBtn">🎁 맞춤 복지·정책 찾기</button></div></div><div class="card"><h2>2. 검색 결과</h2><div id="results" class="empty">조건을 입력하고 <b>맞춤 복지·정책 찾기</b>를 눌러주세요.</div><div id="sharePanel"></div></div><div class="card"><h2>데이터 연결 상태</h2><div class="statusrow"><div class="statusitem"><b>복지로 중앙부처</b><br><span id="natState" class="wait">확인 중</span></div><div class="statusitem"><b>복지로 지자체</b><br><span id="locState" class="wait">확인 중</span></div><div class="statusitem"><b>온통청년</b><br><span class="wait">승인 대기</span></div></div></div></div><script>const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-proxy';const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const TOPIC={"전체":"","취업·훈련":"취업","주거":"주거","금융":"금융","생계":"생계","의료":"의료","돌봄":"돌봄","교육·문화":"교육","청년정책":"청년"};let last=[];async function call(body){const r=await fetch(API,{method:'POST',body:JSON.stringify(body)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('서버 응답을 읽지 못했습니다.')}if(!r.ok||!d.ok)throw Error(d.error||'검색 실패');return d}async function status(){try{const d=await call({action:'status'});$('natState').textContent=d.national?'연결 완료':'키 저장 필요';$('locState').textContent=d.local?'연결 완료':'키 저장 필요';$('natState').className=d.national?'ready':'wait';$('locState').className=d.local?'ready':'wait';$('state').textContent=d.national&&d.local?'복지 API 연결됨':'API 설정 필요'}catch{$('state').textContent='연결 확인 실패'}}function text(s){return String(s||'').toLowerCase()}function rank(x){const age=+$('age').value||0,sido=$('sido').value,gu=$('sigungu').value.trim(),work=$('work').value,topic=$('topic').value,t=text([x.name,x.summary,x.agency,x.target,x.category,JSON.stringify(x.raw)].join(' '));let score=0;if(topic!=='전체'&&t.includes(text(TOPIC[topic])))score+=3;if(sido!=='기타'&&t.includes(text(sido.replace(/광역시|특별시|특별자치도|도$/,''))))score+=3;if(gu&&t.includes(text(gu)))score+=2;if(age&&age<=39&&t.includes('청년'))score+=2;if(work==='미취업'&&(t.includes('구직')||t.includes('취업')||t.includes('실업')))score+=2;return score}function render(items){last=items.sort((a,b)=>rank(b)-rank(a)).slice(0,30);if(!last.length){$('results').className='empty';$('results').innerHTML='검색된 복지서비스가 없습니다. 관심분야를 <b>전체</b>로 바꿔 다시 검색해보세요.';return}$('results').className='';$('results').innerHTML=last.map((x,i)=>{const sc=rank(x),good=sc>=3,src=x.source==='중앙부처'?'nat':'loc';return `<div class="result"><span class="pill ${good?'good':'check'}">${good?'추천':'조건 확인'}</span><span class="pill ${src}">${E(x.source)}</span><div class="rtitle">${E(x.name)}</div>${x.agency?`<div class="meta">${E(x.agency)}</div>`:''}${x.summary?`<div class="meta" style="margin-top:6px">${E(x.summary)}</div>`:''}${x.target?`<div class="box" style="margin-top:8px"><b>대상·조건</b><br>${E(x.target)}</div>`:''}${x.link?`<div style="margin-top:8px"><a class="link" target="_blank" rel="noopener" href="${E(x.link)}">공식 상세 확인 →</a></div>`:''}<button class="btn secondary send" data-i="${i}" style="margin-top:8px">내담자 전송용</button></div>`}).join('');document.querySelectorAll('.send').forEach(b=>b.onclick=()=>share(+b.dataset.i))}function share(i){const x=last[i],s=["[복지·지원정보 안내]","○ 정책명: "+x.name,x.agency?"○ 담당기관: "+x.agency:"",x.summary?"○ 지원내용: "+x.summary:"",x.target?"○ 대상·조건: "+x.target:"",x.link?"○ 자세히 보기: "+x.link:"","※ 실제 신청 가능 여부와 세부 조건은 공식 안내에서 최종 확인해주세요."].filter(Boolean).join('\n');$('sharePanel').innerHTML=`<div class="share"><h2>📤 내담자 전송용</h2><textarea id="shareText" readonly>${E(s)}</textarea><div class="actions"><button class="btn" id="copyBtn">문구 복사</button></div></div>`;$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(s);$('copyBtn').textContent='✓ 복사 완료'}catch{}};$('sharePanel').scrollIntoView({behavior:'smooth'})}async function find(){const btn=$('findBtn');btn.disabled=true;$('results').className='empty';$('results').textContent='복지서비스를 찾고 있습니다...';$('sharePanel').innerHTML='';try{const d=await call({action:'search',keyword:TOPIC[$('topic').value]||''});render(d.services||[])}catch(e){$('results').className='';$('results').innerHTML=`<div class="err"><b>검색할 수 없습니다.</b><br>${E(e.message)}<br><br><a class="link" href="welfare-setup.html">복지 API 설정 화면으로 이동 →</a></div>`}finally{btn.disabled=false}}$('findBtn').onclick=find;status();</script></body></html>
