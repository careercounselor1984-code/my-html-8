<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온통청년 API 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;box-shadow:0 4px 18px #1018280a}h1{font-size:22px;margin:0 0 8px}.sub{font-size:13px;line-height:1.65;color:#667085}.box{margin-top:18px;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e4e7ec}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer;background:#16794e;color:white}button.secondary{background:#eef2f6;color:#172033}.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.6}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.small{font-size:12px;color:#667085;line-height:1.6;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>온통청년 청년정책 API 인증키 설정</h1><div class="sub">온통청년에서 발급받은 OPEN API 인증키를 복지·정책 연계 지원센터 서버에 한 번만 저장합니다. 인증키는 브라우저나 GPT에 보관하지 않고 Supabase Vault에 저장합니다.</div><div id="status" class="msg warn">저장 상태 확인 중...</div><div id="form" class="box"><label for="key">온통청년 OPEN API 인증키</label><input id="key" type="password" autocomplete="off" placeholder="인증키를 이 페이지에만 입력하세요"><div class="actions"><button id="testBtn" class="secondary">연결 테스트</button><button id="saveBtn">테스트 후 서버 저장</button></div><div class="small">채팅창에는 인증키를 보내지 마세요. 저장 전에 실제 청년정책 API 호출로 유효성을 검사하며, 한 번 저장된 키는 이 공개 설정 화면에서 덮어쓸 수 없도록 잠겨 있습니다.</div></div><div id="result"></div></div></div><script>const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-proxy';const $=id=>document.getElementById(id);async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error('서버 응답을 읽지 못했습니다.')}if(!r.ok||!d.ok)throw new Error(d.error||'요청 실패');return d}function show(msg,cls='ok'){$('result').innerHTML='<div class="msg '+cls+'">'+msg+'</div>'}async function check(){try{const d=await call({action:'status'});if(d.youth){$('status').className='msg ok';$('status').textContent='✓ 온통청년 인증키가 서버에 저장되어 있습니다.';$('form').style.display='none'}else{$('status').className='msg warn';$('status').textContent='아직 온통청년 인증키가 저장되지 않았습니다.'}}catch(e){$('status').className='msg err';$('status').textContent=e.message}}$('testBtn').onclick=async()=>{const key=$('key').value.trim();if(!key){show('인증키를 입력해주세요.','err');return}try{$('testBtn').disabled=true;show('온통청년 청년정책 API 연결을 확인하고 있습니다...','warn');const d=await call({action:'youth_test',serviceKey:key});show('✓ 연결 성공'+(Number.isFinite(d.count)?` · 테스트 조회 ${d.count}건`: '')+(d.sample?.name?`<br>예시 정책: ${d.sample.name}`:''),'ok')}catch(e){show('연결 실패: '+e.message,'err')}finally{$('testBtn').disabled=false}};$('saveBtn').onclick=async()=>{const key=$('key').value.trim();if(!key){show('인증키를 입력해주세요.','err');return}try{$('saveBtn').disabled=true;show('연결 테스트 후 안전하게 저장 중입니다...','warn');await call({action:'save_youth_key',serviceKey:key});$('key').value='';$('status').className='msg ok';$('status').textContent='✓ 온통청년 인증키가 서버에 저장되었습니다.';$('form').style.display='none';show('설정 완료. 이제 복지·정책 연계 지원센터에서 온통청년 청년정책도 함께 검색할 수 있습니다.','ok')}catch(e){show('저장 실패: '+e.message,'err')}finally{$('saveBtn').disabled=false}};check();</script></body></html>
