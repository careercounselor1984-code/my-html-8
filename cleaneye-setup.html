<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린아이 API 연결</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 3px 14px #1018280a;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}.sub{font-size:12px;color:#667085;line-height:1.6}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;background:#2457d6;color:#fff}.secondary{background:#eef2f6!important;color:#172033!important}.ok,.warn,.err,.info{padding:12px;border-radius:10px;font-size:12px;line-height:1.65;margin-top:12px}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.info{background:#eff8ff;color:#175cd3}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:12px;border-radius:10px;font-size:11px;max-height:320px;overflow:auto}@media(max-width:720px){.grid2{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>클린아이 잡플러스 API 연결</h1><div class="sub">일반인증키는 이 화면에 직접 입력하세요. 키는 브라우저에 저장하지 않고 API 호출할 때만 전송합니다.</div></div><div class="card"><h2>1. 인증키 입력</h2><label>공공데이터포털 일반인증키</label><input id="key" type="password" autocomplete="off" placeholder="일반인증키를 여기에 붙여넣기"><div class="actions"><button onclick="findUlsan()">울산 자동 연결 테스트</button><button class="secondary" onclick="discover()">전국 지역코드 찾기</button></div><div id="status"></div></div><div class="card"><h2>2. 지역 선택 및 DB 저장</h2><div class="grid2"><div><label>지역</label><select id="region"><option value="">먼저 지역코드를 찾아주세요</option></select></div><div><label>코드</label><input id="code" readonly></div></div><div class="actions"><button class="secondary" onclick="testSelected()">선택지역 연결 테스트</button><button onclick="syncSelected()">선택지역 DB 저장</button></div><div id="syncStatus"></div></div><div class="card"><h2>3. 테스트 결과</h2><div id="result" class="sub">아직 테스트하지 않았습니다.</div></div><div class="card"><a class="btn secondary" href="job-fit.html">← 채용 지원가능성 분석센터로 돌아가기</a></div></div><script>const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/cleaneye-proxy';let regions=[];async function call(body){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error('서버 응답을 읽지 못했습니다.')}if(!r.ok||!d.ok)throw Error(d.error||'API 오류');return d}function needKey(){let k=key.value.trim();if(!k){status.innerHTML='<div class="err">일반인증키를 먼저 입력하세요.</div>';return null}return k}function renderRegions(){region.innerHTML=regions.length?regions.map(x=>`<option value="${x.code}">${x.name||'지역명 미확인'} (${x.code}) · ${x.count}건</option>`).join(''):'<option value="">확인된 지역 없음</option>';region.onchange=()=>code.value=region.value;if(regions.length){code.value=region.value}}async function discover(){let k=needKey();if(!k)return;status.innerHTML='<div class="info">전국 지역코드를 확인하고 있습니다. 잠시 걸릴 수 있어요…</div>';try{let d=await call({action:'discover',serviceKey:k});regions=d.regions||[];renderRegions();status.innerHTML=`<div class="ok"><b>연결 성공</b><br>확인된 지역 ${regions.length}개</div>`;result.innerHTML='<pre>'+escapeHtml(JSON.stringify(regions,null,2))+'</pre>'}catch(e){status.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>'}}async function findUlsan(){let k=needKey();if(!k)return;status.innerHTML='<div class="info">울산 코드를 자동으로 찾는 중…</div>';try{let d=await call({action:'discover',serviceKey:k});regions=d.regions||[];renderRegions();let u=regions.find(x=>(x.name||'').includes('울산'));if(!u){status.innerHTML='<div class="warn">API 연결은 되었지만 울산 코드를 자동으로 찾지 못했습니다. 아래 전국 지역코드 결과를 확인해주세요.</div>';result.innerHTML='<pre>'+escapeHtml(JSON.stringify(regions,null,2))+'</pre>';return}region.value=u.code;code.value=u.code;let t=await call({action:'test',serviceKey:k,sidoCd:u.code});showTest(t);status.innerHTML=`<div class="ok"><b>울산 연결 성공</b><br>${u.code} · ${t.count}건 확인</div>`}catch(e){status.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>'}}async function testSelected(){let k=needKey();if(!k)return;if(!region.value)return syncStatus.innerHTML='<div class="err">지역을 먼저 선택하세요.</div>';syncStatus.innerHTML='<div class="info">연결 테스트 중…</div>';try{let d=await call({action:'test',serviceKey:k,sidoCd:region.value});showTest(d);syncStatus.innerHTML=`<div class="ok">${escapeHtml(d.sidoName||region.value)} · ${d.count}건 확인</div>`}catch(e){syncStatus.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>'}}async function syncSelected(){let k=needKey();if(!k)return;if(!region.value)return syncStatus.innerHTML='<div class="err">지역을 먼저 선택하세요.</div>';syncStatus.innerHTML='<div class="info">DB에 저장 중…</div>';try{let d=await call({action:'sync',serviceKey:k,sidoCd:region.value});syncStatus.innerHTML=`<div class="ok"><b>저장 완료</b><br>${escapeHtml(d.sidoName||region.value)} · API ${d.received}건 / DB ${d.saved}건</div>`;result.innerHTML='<pre>'+escapeHtml(JSON.stringify(d.sample||{},null,2))+'</pre>'}catch(e){syncStatus.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>'}}function showTest(d){result.innerHTML=`<div class="ok"><b>${escapeHtml(d.sidoName||d.sidoCd)} 연결 확인</b><br>수신 ${d.count}건</div><div class="sub" style="margin-top:10px">첫 번째 공고에서 확인된 필드</div><pre>${escapeHtml(JSON.stringify(d.first||{},null,2))}</pre>`}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
