<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클린아이 API 연결</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:900px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;box-shadow:0 3px 14px #1018280a;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}.sub{font-size:12px;color:#667085;line-height:1.6}label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;background:#2457d6;color:#fff}.secondary{background:#eef2f6!important;color:#172033!important}.ok,.warn,.err,.info{padding:12px;border-radius:10px;font-size:12px;line-height:1.65;margin-top:12px}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.info{background:#eff8ff;color:#175cd3}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:12px;border-radius:10px;font-size:11px;max-height:320px;overflow:auto}@media(max-width:720px){.grid2{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>클린아이 잡플러스 API 연결 <span style="font-size:12px;color:#667085">v1.2</span></h1><div class="sub">일반인증키는 이 화면에 직접 입력하세요. 키는 브라우저에 저장하지 않고 API 호출할 때만 전송합니다.</div><div id="bootStatus" class="info">페이지 스크립트 확인 중…</div></div><div class="card"><h2>1. 인증키 입력</h2><label>공공데이터포털 일반인증키</label><input id="keyInput" type="password" autocomplete="off" placeholder="일반인증키를 여기에 붙여넣기"><div class="actions"><button id="ulsanBtn" type="button">울산 자동 연결 테스트</button><button id="discoverBtn" class="secondary" type="button">전국 지역코드 찾기</button></div><div id="apiStatus"></div></div><div class="card"><h2>2. 지역 선택 및 DB 저장</h2><div class="grid2"><div><label>지역</label><select id="regionSelect"><option value="">먼저 지역코드를 찾아주세요</option></select></div><div><label>코드</label><input id="codeInput" readonly></div></div><div class="actions"><button id="testBtn" class="secondary" type="button">선택지역 연결 테스트</button><button id="syncBtn" type="button">선택지역 DB 저장</button></div><div id="syncStatus"></div></div><div class="card"><h2>3. 테스트 결과</h2><div id="resultBox" class="sub">아직 테스트하지 않았습니다.</div></div><div class="card"><a class="btn secondary" href="job-fit.html">← 채용 지원가능성 분석센터로 돌아가기</a></div></div><script>
(function(){
'use strict';
const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/cleaneye-proxy';
const el={
 key:document.getElementById('keyInput'),
 ulsan:document.getElementById('ulsanBtn'),
 discover:document.getElementById('discoverBtn'),
 apiStatus:document.getElementById('apiStatus'),
 region:document.getElementById('regionSelect'),
 code:document.getElementById('codeInput'),
 test:document.getElementById('testBtn'),
 sync:document.getElementById('syncBtn'),
 syncStatus:document.getElementById('syncStatus'),
 result:document.getElementById('resultBox'),
 boot:document.getElementById('bootStatus')
};
let regions=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setApi(html){el.apiStatus.innerHTML=html}
function setSync(html){el.syncStatus.innerHTML=html}
function needKey(){const k=el.key.value.trim();if(!k){setApi('<div class="err">일반인증키를 먼저 입력하세요.</div>');return null}return k}
async function call(body){const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error('서버 응답을 읽지 못했습니다: '+t.slice(0,120))}if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function renderRegions(){el.region.innerHTML=regions.length?regions.map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name||'지역명 미확인')+' ('+esc(x.code)+') · '+esc(x.count)+'건</option>').join(''):'<option value="">확인된 지역 없음</option>';el.code.value=el.region.value||''}
function showTest(d){el.result.innerHTML='<div class="ok"><b>'+esc(d.sidoName||d.sidoCd||'지역')+' 연결 확인</b><br>수신 '+esc(d.count)+'건</div><div class="sub" style="margin-top:10px">첫 번째 공고에서 확인된 필드</div><pre>'+esc(JSON.stringify(d.first||{},null,2))+'</pre>'}
async function discover(){const k=needKey();if(!k)return;setApi('<div class="info"><b>버튼 정상 작동</b><br>전국 지역코드를 확인 중입니다. 최대 수십 초 걸릴 수 있습니다.</div>');try{const d=await call({action:'discover',serviceKey:k});regions=d.regions||[];renderRegions();setApi('<div class="ok"><b>API 연결 성공</b><br>확인된 지역 '+regions.length+'개</div>');el.result.innerHTML='<pre>'+esc(JSON.stringify(regions,null,2))+'</pre>'}catch(e){setApi('<div class="err"><b>API 연결 오류</b><br>'+esc(e.message)+'</div>')}}
async function findUlsan(){const k=needKey();if(!k)return;setApi('<div class="info"><b>버튼 정상 작동</b><br>울산 지역코드를 찾고 있습니다…</div>');try{const d=await call({action:'discover',serviceKey:k});regions=d.regions||[];renderRegions();const u=regions.find(x=>String(x.name||'').includes('울산'));if(!u){setApi('<div class="warn"><b>API 호출은 성공</b><br>울산 지역코드를 자동으로 찾지 못했습니다. 아래 결과를 확인해주세요.</div>');el.result.innerHTML='<pre>'+esc(JSON.stringify(regions,null,2))+'</pre>';return}el.region.value=u.code;el.code.value=u.code;const t=await call({action:'test',serviceKey:k,sidoCd:u.code});showTest(t);setApi('<div class="ok"><b>울산 연결 성공</b><br>'+esc(u.code)+' · '+esc(t.count)+'건 확인</div>')}catch(e){setApi('<div class="err"><b>연결 테스트 오류</b><br>'+esc(e.message)+'</div>')}}
async function testSelected(){const k=needKey();if(!k)return;if(!el.region.value){setSync('<div class="err">지역을 먼저 선택하세요.</div>');return}setSync('<div class="info">연결 테스트 중…</div>');try{const d=await call({action:'test',serviceKey:k,sidoCd:el.region.value});showTest(d);setSync('<div class="ok">'+esc(d.sidoName||el.region.value)+' · '+esc(d.count)+'건 확인</div>')}catch(e){setSync('<div class="err">'+esc(e.message)+'</div>')}}
async function syncSelected(){const k=needKey();if(!k)return;if(!el.region.value){setSync('<div class="err">지역을 먼저 선택하세요.</div>');return}setSync('<div class="info">DB에 저장 중…</div>');try{const d=await call({action:'sync',serviceKey:k,sidoCd:el.region.value});setSync('<div class="ok"><b>저장 완료</b><br>'+esc(d.sidoName||el.region.value)+' · API '+esc(d.received)+'건 / DB '+esc(d.saved)+'건</div>');el.result.innerHTML='<pre>'+esc(JSON.stringify(d.sample||{},null,2))+'</pre>'}catch(e){setSync('<div class="err">'+esc(e.message)+'</div>')}}
el.region.addEventListener('change',()=>{el.code.value=el.region.value||''});
el.ulsan.addEventListener('click',findUlsan);
el.discover.addEventListener('click',discover);
el.test.addEventListener('click',testSelected);
el.sync.addEventListener('click',syncSelected);
el.boot.className='ok';el.boot.innerHTML='<b>스크립트 정상 실행됨</b><br>이 문구가 보이면 버튼 기능은 정상적으로 연결된 상태입니다.';
})();
</script></body></html>
