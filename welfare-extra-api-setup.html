<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>복지 추가 API 설정</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:38px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;box-shadow:0 4px 18px #1018280a}h1{font-size:22px;margin:0 0 8px}.sub{font-size:13px;line-height:1.7;color:#667085}.box{margin-top:18px;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e4e7ec}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer;background:#16794e;color:#fff}button.secondary{background:#eef2f6;color:#172033}.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:13px;line-height:1.65}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#7a4b00}.err{background:#fef3f2;color:#b42318}.small{font-size:12px;color:#667085;line-height:1.65;margin-top:10px}.checks{display:grid;gap:7px;margin-top:10px}.check{padding:9px 10px;border-radius:9px;background:#fff;border:1px solid #e4e7ec;font-size:12px}.yes{color:#067647;font-weight:800}.no{color:#b42318;font-weight:800}</style></head><body><div class="wrap"><div class="card"><h1>금융·마이홈 추가 API 인증키 설정</h1><div class="sub">방금 승인받은 5개 API를 복지·정책 연계 지원센터 서버에 연결합니다. 같은 <b>공공데이터포털 프로젝트 서비스키</b>로 5개를 신청했다면 인증키는 한 번만 입력하면 됩니다. 키는 브라우저나 GPT에 저장하지 않고 서버 Vault에 보관합니다.</div><div id="status" class="msg warn">저장 상태 확인 중...</div><div id="form" class="box"><label for="key">공공데이터포털 프로젝트 서비스키</label><input id="key" type="password" autocomplete="off" placeholder="인증키는 이 페이지에만 입력하세요"><div class="actions"><button id="testBtn" class="secondary">5개 연결 테스트</button><button id="saveBtn">테스트 후 서버 저장</button></div><div class="small">테스트 대상: ① 서민금융 대출상품한눈에 ② 서민대출상품 취급기관 ③ 마이홈 공공주택 모집공고 ④ 마이홈 예비입주자 대기현황 ⑤ 마이홈 공공임대 단지정보<br><b>채팅창에는 인증키를 보내지 마세요.</b></div></div><div id="result"></div></div></div><script>const API='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/welfare-extra-setup';const $=id=>document.getElementById(id);async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('서버 응답을 읽지 못했습니다.')}if(!r.ok||!d.ok){const e=Error(d.error||'요청 실패');e.data=d;throw e}return d}function renderChecks(d){const rows=Object.values(d.result||{}).map(x=>`<div class="check"><span class="${x.ok?'yes':'no'}">${x.ok?'✓':'✕'}</span> ${x.label}</div>`).join('');return `<div class="checks">${rows}</div>`}function show(html,cls='ok'){$('result').innerHTML=`<div class="msg ${cls}">${html}</div>`}async function check(){try{const d=await call({action:'status'});if(d.connected){$('status').className='msg ok';$('status').textContent='✓ 금융·마이홈 API 인증키가 서버에 저장되어 있습니다.';$('form').style.display='none'}else{$('status').className='msg warn';$('status').textContent='아직 추가 API 인증키가 저장되지 않았습니다.'}}catch(e){$('status').className='msg err';$('status').textContent=e.message}}$('testBtn').onclick=async()=>{const key=$('key').value.trim();if(!key){show('인증키를 입력해주세요.','err');return}try{$('testBtn').disabled=true;show('5개 API 승인 상태와 인증키를 확인하고 있습니다...','warn');const d=await call({action:'test',serviceKey:key});show(`✓ ${d.total}개 중 ${d.pass}개 인증 확인${renderChecks(d)}`,'ok')}catch(e){const d=e.data||{};show(`연결 확인 실패: ${e.message}${d.result?renderChecks(d):''}<br><br>같은 프로젝트 서비스키로 신청하지 않았다면 알려주세요. API별 입력 방식으로 바꿔드릴 수 있습니다.`,'err')}finally{$('testBtn').disabled=false}};$('saveBtn').onclick=async()=>{const key=$('key').value.trim();if(!key){show('인증키를 입력해주세요.','err');return}try{$('saveBtn').disabled=true;show('5개 API 확인 후 서버 Vault에 저장하고 있습니다...','warn');const d=await call({action:'save',serviceKey:key});$('key').value='';$('status').className='msg ok';$('status').textContent='✓ 금융·마이홈 API 인증키가 서버에 저장되었습니다.';$('form').style.display='none';show(`설정 완료 · ${d.total}개 중 ${d.pass}개 인증 확인${renderChecks(d)}<br><br>이제 복지·정책 연계 지원센터에 금융상품·취급기관·공공임대 모집공고·단지·대기현황을 연결할 수 있습니다.`,'ok')}catch(e){const d=e.data||{};show(`저장 실패: ${e.message}${d.result?renderChecks(d):''}`,'err')}finally{$('saveBtn').disabled=false}};check();</script></body></html>
